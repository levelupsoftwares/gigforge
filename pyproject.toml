[project]
name = "gigforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "usman butt", email = "usmanbutt2357@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
gigforge = "gigforge:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pyrefly]
search-path = ["."]
